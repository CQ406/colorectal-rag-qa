# ============================================================
#  结直肠手术围术期多模态知识库智能问答系统
#  基础设施编排：PostgreSQL+pgvector / Neo4j / Redis / MinIO
#
#  启动:  docker compose up -d
#  查看:  docker compose ps
#  日志:  docker compose logs -f postgres
#  停止:  docker compose down          （保留数据卷）
#  清空:  docker compose down -v       （⚠️ 删除全部数据）
#
#  注意：检索模型(BGE-M3/reranker)跑在宿主机 GPU 上，不在容器内。
# ============================================================

name: colorectal-rag

# ⚠ 本文件中的口令兜底值（${VAR:-xxx}）仅供本地开发；部署时请在 .env 中设置真实口令。
services:
  # ---------- PostgreSQL + pgvector：元数据、文本块、向量 ----------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-colorectal_rag}
      # 中文全文检索需要，配合 init 脚本创建扩展
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动执行，创建 vector 扩展与中文分词
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-colorectal_rag}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  # ---------- Neo4j：结直肠手术知识图谱 ----------
  neo4j:
    image: neo4j:5-community
    container_name: cr-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_dev_pwd}
      # 允许从宿主机浏览器访问 Neo4j Browser，用于论文截图
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Neo4j Browser
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt 协议
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G

  # ---------- Redis：会话上下文、检索缓存、Celery broker ----------
  redis:
    image: redis:7-alpine
    container_name: cr-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  # ---------- 对象存储说明 ----------
  # 原计划使用 MinIO，但 MinIO 已于 2025-10 撤下官方 Docker 镜像
  # （开源社区版停止分发，minio/minio 在 Docker Hub 上已不存在）。
  # 详见: https://www.appinn.com/minio-remove-docker-images/
  #
  # 本课题改用【本地文件系统存储】，理由：
  #   1. 文献 PDF 与影像文件通过后端统一接口读写，不需要 S3 的分布式能力
  #   2. 少一个容器依赖，降低部署与答辩演示的故障面
  #   3. 存储层已抽象为 StorageBackend 接口(app/services/storage.py)，
  #      将来若需对象存储，换实现类即可，业务代码无需改动
  #
  # 如后续确需 S3 兼容存储，可选替代方案（均仍在维护）：
  #   - SeaweedFS:  image: chrislusf/seaweedfs
  #   - Garage:     image: dxflrs/garage
  #   - 自建 MinIO: 参考 https://github.com/netvark/minio-docker-build

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
  redisdata:
